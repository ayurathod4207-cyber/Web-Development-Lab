
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newspaper Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>THE DAILY NEWS</h1>
        <p>Your source of daily information</p>
    </header>

    <main class="newspaper">

        <article class="news">
            <h2>Technology News</h2>
            <p>Technology is changing the world every day.</p>
        </article>

        <article class="news">
            <h2>Education News</h2>
            <p>Digital learning is becoming increasingly popular.</p>
        </article>

        <article class="news">
            <h2>Sports News</h2>
            <p>Sports help people maintain a healthy lifestyle.</p>
        </article>

    </main>

    <footer>
        <p>Daily News 2026</p>
    </footer>

</body>
</html>
