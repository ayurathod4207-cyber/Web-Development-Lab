
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>My Website</h2>
        <a href="#home">Home</a>
        <a href="#about">About</a>
    </nav>

    <main id="home">
        <h1>CSS Positioning</h1>

        <div class="card">
            <img src="https://placehold.co/600x350" alt="Sample landscape">
            <div class="overlay">
                <h2>My Project</h2>
                <p>Web development project</p>
            </div>
        </div>

        <section id="about">
            <h2>About this practical</h2>
            <p>Scroll to see the sticky navigation bar.</p>
        </section>
    </main>

</body>
</html>
